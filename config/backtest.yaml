# Backtesting configuration for AI Trading Signals

# Walk-forward validation setup
walk_forward:
  # Time windows
  train_window: 252    # Trading days for training
  test_window: 63      # Trading days for testing
  step_size: 21        # Trading days to step forward
  min_train_size: 100   # Minimum training samples
  
  # Data handling
  overlap: false        # Allow overlapping windows
  purge_gap: 5          # Days to purge between train/test
  
  # Expansion options
  expanding_window: false  # Use expanding training window
  rolling_window: true     # Use rolling training window

# Performance metrics configuration
metrics:
  # Return metrics
  returns:
    - "total_return"
    - "annualized_return"
    - "monthly_returns"
    - "daily_returns"
    
  # Risk-adjusted metrics
  risk_adjusted:
    - "sharpe_ratio"
    - "sortino_ratio"
    - "calmar_ratio"
    - "information_ratio"
    - "treynor_ratio"
    
  # Risk metrics
  risk:
    - "max_drawdown"
    - "avg_drawdown"
    - "drawdown_duration"
    - "volatility"
    - "var_95"  # Value at Risk 95%
    - "cvar_95"  # Conditional VaR 95%
    
  # Trade statistics
  trade_stats:
    - "win_rate"
    - "profit_factor"
    - "avg_win"
    - "avg_loss"
    - "best_trade"
    - "worst_trade"
    - "avg_trade_duration"
    - "trade_frequency"
    
  # Additional metrics
  additional:
    - "skewness"
    - "kurtosis"
    - "tail_ratio"
    - "hit_ratio"

# Trading costs and slippage
costs:
  # Commission
  commission:
    type: "percentage"  # percentage, fixed, tiered
    value: 0.001        # 0.1% per trade
    min_commission: 1.0  # Minimum commission
    
  # Slippage
  slippage:
    type: "percentage"  # percentage, fixed, volatility_based
    value: 0.0005       # 0.05% per trade
    volatility_multiplier: 0.1
    
  # Financing costs
  financing:
    overnight_rate: 0.0001  # Daily overnight rate
    weekend_multiplier: 2.0

# Position sizing and risk limits
position_sizing:
  # Base sizing
  base_size: 0.1        # 10% of capital per trade
  max_size: 0.5         # 50% maximum position size
  min_size: 0.01        # 1% minimum position size
  
  # Risk-based sizing
  risk_per_trade: 0.02  # 2% risk per trade
  max_risk: 0.1         # 10% maximum portfolio risk
  
  # Portfolio limits
  max_positions: 5      # Maximum concurrent positions
  max_correlation: 0.7  # Maximum correlation between positions

# Risk management
risk_management:
  # Stop loss
  stop_loss:
    enabled: true
    method: "percentage"  # percentage, atr, volatility
    value: 0.02          # 2% stop loss
    trailing_stop: false
    trailing_distance: 0.01
  
  # Take profit
  take_profit:
    enabled: false
    method: "percentage"
    value: 0.05          # 5% take profit
    
  # Drawdown limits
  drawdown_limits:
    max_drawdown: 0.15   # 15% maximum drawdown
    daily_loss_limit: 0.05  # 5% daily loss limit
    
  # Position limits
  position_limits:
    max_exposure: 1.0    # 100% maximum exposure
    sector_limits: {}    # Sector-specific limits

# Market conditions
market_conditions:
  # Trading hours
  trading_hours:
    start: "09:30"
    end: "16:00"
    timezone: "UTC"
    
  # Exclusions
  exclude:
    weekends: true
    holidays: true
    earnings_season: false
    
  # Volatility regimes
  volatility_regimes:
    low: {"threshold": 0.01, "position_multiplier": 1.5}
    normal: {"threshold": 0.02, "position_multiplier": 1.0}
    high: {"threshold": 0.04, "position_multiplier": 0.5}

# Reporting and visualization
reporting:
  # Basic reports
  basic:
    equity_curve: true
    drawdown_chart: true
    monthly_returns: true
    annual_returns: true
    
  # Detailed reports
  detailed:
    trade_list: true
    performance_attribution: true
    risk_metrics: true
    correlation_matrix: true
    
  # Advanced analytics
  advanced:
    regime_analysis: true
    factor_exposure: true
    scenario_analysis: true
    stress_testing: true
    
  # Export options
  export:
    format: ["csv", "html", "pdf"]
    include_charts: true
    raw_data: false

# Benchmarking
benchmarks:
  # Market benchmarks
  market:
    - "SPY"   # S&P 500
    - "QQQ"   # NASDAQ 100
    
  # Strategy benchmarks
  strategy:
    - "buy_and_hold"
    - "moving_average_crossover"
    - "mean_reversion"
    
  # Performance comparison
  comparison:
    relative_returns: true
    correlation_analysis: true
    rolling_sharpe: true

# Validation and testing
validation:
  # Statistical tests
  statistical_tests:
    autocorrelation: true
    stationarity: true
    normality: false
    
  # Robustness checks
  robustness:
    sensitivity_analysis: true
    parameter_stability: true
    out_of_sample_testing: true
    
  # Bootstrap analysis
  bootstrap:
    enabled: true
    n_samples: 1000
    confidence_level: 0.95

# Experiment tracking
experiment_tracking:
  # Metadata
  metadata:
    strategy_name: "ai_trading_signals"
    version: "1.0.0"
    description: "Probabilistic trading with Monte Carlo"
    
  # Parameters logging
  parameters:
    model_params: true
    strategy_params: true
    data_params: true
    
  # Results storage
  results:
    save_to_database: false
    save_to_file: true
    file_format: "parquet"

# Performance optimization
optimization:
  # Parallel processing
  parallel:
    enabled: true
    n_jobs: -1  # Use all available cores
    chunk_size: 1000
    
  # Memory management
  memory:
    chunk_data_loading: true
    max_memory_usage: "4GB"
    garbage_collection: true
    
  # Caching
  caching:
    enabled: true
    cache_dir: "cache/backtest"
    ttl: 3600  # Time to live in seconds
